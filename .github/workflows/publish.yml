name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write  # 必须：用于 OIDC Provenance 签名

jobs:
  publish:
    name: Publish @choi-p/dsh-footer-order
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # 固定版本(与本地一致), 不要用 latest, 避免 pnpm 新版本要求更高 Node
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # pnpm 11 要求 Node >= 22.13
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish with Provenance
        run: pnpm publish --provenance --no-git-checks
